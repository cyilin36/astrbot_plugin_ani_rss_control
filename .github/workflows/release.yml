# 发布：推送 tag 时创建 GitHub Release
#
# 触发：推送 tag（形如 1.2.3 或 1.2.3-beta.1，允许 v 前缀）。
#
#   1.2.3          稳定版：创建 Release，并标记为 Latest。
#   1.2.3-beta.1   预发布版：创建 Release，标记为 pre-release，不标记 Latest。
#
# 说明：
#   - 只使用内置 GITHUB_TOKEN，无需额外配置 secret。
#   - tag 含至少两个点但格式不符合上述两种形式时直接报错，避免手误静默跳过。
#   - 同一 tag 重复触发时跳过已存在的 Release，保证重跑安全。
#   - 版本号支持语义化预发布后缀；不支持构建元数据（+ 后缀）。

name: 发布

on:
  push:
    tags:
      # 先粗匹配含至少两个点的 tag，具体格式在任务内严格校验
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: 创建 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 校验 tag 并创建 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          stable_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          pre_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)$'

          if [[ "$version" =~ $stable_re ]]; then
            prerelease=false
          elif [[ "$version" =~ $pre_re ]]; then
            prerelease=true
          else
            echo "::error::tag \"$TAG\" 不符合 x.x.x 或 x.x.x-xxx 格式，已中止发布"
            exit 1
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG 已存在，跳过创建"
            exit 0
          fi

          args=(--title "$TAG" --generate-notes --verify-tag)
          if [[ "$prerelease" == "true" ]]; then
            # 预发布：标记为 pre-release，不覆盖 Latest
            args+=(--prerelease --latest=false)
            channel='测试版本（pre-release，不标记 Latest）'
          else
            # 稳定版：标记为 Latest
            args+=(--latest)
            channel='稳定版本（标记为 Latest）'
          fi

          gh release create "$TAG" "${args[@]}"

          {
            echo "## 发布完成"
            echo
            echo "- tag：\`$TAG\`"
            echo "- 版本：\`$version\`"
            echo "- 类型：$channel"
            echo "- 地址：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
