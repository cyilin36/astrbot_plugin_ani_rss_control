# 持续集成：代码格式与静态检查
#
# 说明：
#   - 只做格式与静态检查，不运行本地测试代码。
#   - 不依赖密钥、生产环境或外部网络。
name: 格式检查

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 检查格式
        run: ruff format --check .

      - name: 静态检查
        run: ruff check .
